<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slide Animation</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Merriweather&family=Roboto&display=swap");

      body {
        margin: 0;
        padding: 0;
        font-family: "Merriweather", serif;
        width: 100vw;
        height: 100vh;
      }

      #slide-container {
        margin: 0 auto;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      h1 {
        --title-font-size: 2.5em;
        --title-scale: 1.3;
        font-size: var(--title-font-size);
        font-family: "Roboto", sans-serif;
        text-align: center;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 10px;
        padding: 0.5em;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(var(--title-scale));
        transition: all 1s ease-out;
        margin: 0;
        white-space: nowrap;
      }

      h1.final-position {
        top: 0.7em;
        left: 50%;
        transform: translateX(-50%) scale(1);
      }

      .bullet-list {
        list-style: none;
        padding: 0;
        margin: 2em auto;
        width: 90%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.5em;
        align-items: start;
        height: 100%;
      }

      .bullet-list li {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        font-family: "Merriweather", serif;
        padding: 1em;
        box-sizing: border-box;
      }

      .bullet-title,
      .bullet-body {
        opacity: 0;
        transition: opacity 0.5s ease-in, transform 0.5s ease-in;
        width: 100%;
      }

      .bullet-title {
        transform: scale(0.8);
      }

      .bullet-body {
        transform: translateX(50px);
      }

      .bullet-list li .bullet-title-text {
        font-size: 1.6em;
        color: #fff;
        margin-bottom: 0.5em;
      }

      .bullet-list li .bullet-body-text {
        font-size: 1.1em;
        color: #ccc;
      }

      .bullet-list li:last-child:nth-child(odd) {
        grid-column: 1 / -1;
        width: 50%;
        margin: 0 auto;
      }
    </style>
  </head>

  <body
    style="
    background-image: url('{{ slide.background_src }}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
"
  >
    <div id="slide-container">
      <h1>{{ slide.title }}</h1>
      <ul class="bullet-list">
        {% for point in slide.bullet_points %}
        <li>
          <div class="bullet-title" data-start-time="{{ point.title_start_time - slide.start_time }}">
            <div class="bullet-title-text">{{ point.title }}</div>
          </div>
          <div class="bullet-body" data-start-time="{{ point.start_time - slide.start_time }}">
            <div class="bullet-body-text">{{ point.text }}</div>
          </div>
        </li>
        {% endfor %}
      </ul>
    </div>
    <script>
      window.onload = function () {
        const title = document.querySelector("h1");
        const bulletList = document.querySelector(".bullet-list");
        const bulletTitles = document.querySelectorAll(".bullet-title");
        const bulletBodies = document.querySelectorAll(".bullet-body");
        const container = document.querySelector("#slide-container");
        const initialDelay = 250;

        // Handling title overflow
        const titleScale = parseFloat(getComputedStyle(title).getPropertyValue("--title-scale"));
        const titleFontSize = parseFloat(getComputedStyle(title).getPropertyValue("--title-font-size"));
        // if overflows horizontally, use unitary method to resize to fit horizontally
        if (title.scrollWidth * titleScale > container.clientWidth) {
          title.style.fontSize = `${(container.clientWidth * titleFontSize) / (title.scrollWidth * titleScale) - 0.2}em`;
        }

        setTimeout(() => {
          // Add title animation
          const mainTitleDelay = parseInt(bulletTitles[0].getAttribute("data-start-time"), 10) * 1000 - 2000;
          if (mainTitleDelay < 0) mainTitleDelay = 0;
          setTimeout(() => {
            title.classList.add("final-position");
            bulletList.style.paddingTop = `${title.offsetHeight + 40}px`;

            // Handling bullet poits overflow
            if (bulletList.scrollHeight > container.clientHeight) {
              console.log("overflow");
              bulletList.style.gap = "0em";
              document.querySelectorAll(".bullet-title-text").forEach((title) => {
                title.style.fontSize = "1.2em";
              });
              document.querySelectorAll(".bullet-body-text").forEach((content) => {
                content.style.fontSize = "1em";
              });
            }
          }, mainTitleDelay);

          // Animate titles
          bulletTitles.forEach((title) => {
            const startTime = parseInt(title.getAttribute("data-start-time"), 10) * 1000;
            setTimeout(() => {
              title.style.opacity = 1;
              title.style.transform = "scale(1)";
            }, startTime);
          });

          // Animate bodies
          bulletBodies.forEach((body) => {
            const startTime = parseInt(body.getAttribute("data-start-time"), 10) * 1000;
            setTimeout(() => {
              body.style.opacity = 1;
              body.style.transform = "translateX(0)";
            }, startTime);
          });
        }, initialDelay);
      };
    </script>
  </body>
</html>
