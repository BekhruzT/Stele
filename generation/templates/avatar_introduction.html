<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ avatar_intro.avatar_name }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        .container {
            position: absolute;
            bottom: 3em;
            left: 2em;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        @keyframes enlarge {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes wait {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .quote,
        .author {
            position: relative;
            width: max-content;
            box-sizing: border-box;
            color: white;
            font-family: 'Georgia', serif;
            border-radius: 5px;
        }

        @keyframes eraseQuote {
            0% {
                clip-path: inset(0 0 0 0);
            }
            100% {
                clip-path: inset(0 100% 0 0);
            }
        }

        @keyframes eraseAuthor {
            0% {
                clip-path: inset(0 0 0 0);
            }
            100% {
                clip-path: inset(0 100% 0 0);
            }
        }

        .author {
            background-color: #01082D;
            z-index: 2;
            font-size: 22px;
            font-style: italic;
            padding: 7px 20px;
            margin-bottom: -15px;
            padding-right: 20px;
            margin-left: 2em;
            border: 2px solid white;
        }

        .quote {
            background-color: #18344C;
            font-size: 20px;
            padding: 15px 65px 15px 10px;
        }

        .quote p,
        .author p {
            margin: 0;
        }

        .author {
            margin-bottom: -13px;
        }
    </style>
</head>

<body>

    <div class="container" style="
        animation: 
            enlarge 1s forwards ease-out,
            wait {{ duration - 2.7 }}s 1s forwards;
        transform-origin: center;
        opacity: 0;
    ">
        <div class="author" style="
            animation: eraseAuthor 0.45s {{ duration - 0.95 }}s forwards linear;
        ">
            <p>- {{ avatar_intro.avatar_name }}</p>
        </div>
        <div class="quote" style="
            animation: eraseQuote 0.6s {{ duration - 1.7 }}s forwards linear;
        ">
            <p>"{{ avatar_intro.description }}"</p>
        </div>
    </div>

</body>

</html>
